name: Build Office Ledger APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK build packages
        shell: bash
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDK" ]; then SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          test -x "$SDK" || { echo "Missing SDK manager in $ANDROID_HOME"; find "$ANDROID_HOME/cmdline-tools" -name sdkmanager; exit 1; }
          yes | "$SDK" --licenses >/dev/null || true
          "$SDK" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: OfficeLedger-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
